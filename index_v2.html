;gap:2vw;min-height:0}.team-panel{position:relative;overflow:hidden;border-radius:3vh;padding:3vh 2.4vw;display:grid;grid-template-rows:auto auto 1fr auto;background:var(--panel2)}.home-panel{border-left:.65vw solid var(--ice)}.away-panel{border-right:.65vw solid var(--orange)}.team-panel:before{content:"";position:absolute;inset:-20%;background:linear-gradient(135deg,rgba(255,255,255,.08),transparent 35%,rgba(255,255,255,.035));transform:skewX(-10deg);pointer-events:none}.team-meta{position:relative;display:flex;justify-content:space-between;color:var(--muted);letter-spacing:.16em;font-weight:900;font-size:2vh}.team-name{position:relative;font-family:Anton,Impact,sans-serif;font-size:clamp(48px,7.2vh,96px);line-height:.98;letter-spacing:.035em;text-transform:uppercase;margin-top:2vh;text-shadow:0 1vh 2vh rgba(0,0,0,.55);word-break:break-word}.score-row{position:relative;display:flex;justify-content:flex-end;align-items:center}.score{font-family:Anton,Impact,sans-serif;font-size:clamp(150px,28vh,320px);line-height:.8;letter-spacing:.02em;font-variant-numeric:tabular-nums}.team-stats{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:.8vw}.team-stats div{background:rgba(0,0,0,.35);border:1px solid var(--border);border-radius:1.2vh;text-align:center;padding:1.2vh .6vw}.team-stats span{display:block;font-family:Anton,Impact,sans-serif;font-size:4vh}.team-stats label{display:block;color:var(--muted);text-transform:uppercase;font-size:1.45vh;letter-spacing:.18em}.center-stack{display:grid;grid-template-rows:1fr auto 1fr;gap:1.7vh;align-items:center}.shot-clock-card,.possession-card{background:rgba(0,0,0,.52);border-radius:2.5vh;text-align:center;padding:2.2vh 1vw}.shot-clock{font-family:Anton,Impact,sans-serif;font-size:15vh;line-height:.9;color:var(--gold);font-variant-numeric:tabular-nums}.shot-clock-card.warning .shot-clock{color:var(--orange)}.shot-clock-card.critical .shot-clock{color:var(--danger);animation:shotPulse .45s infinite}.shot-clock-card.expired .shot-clock{color:var(--danger)}.shot-clock-card.buzz{animation:buzzFlash .35s ease-in-out 5}.penalty-card{background:rgba(0,0,0,.52);border:1px solid var(--border);border-radius:2.2vh;text-align:center;padding:1.6vh 1vw;box-shadow:0 0 38px rgba(0,0,0,.45),inset 0 0 24px rgba(255,255,255,.035);backdrop-filter:blur(10px)}.penalty-title{color:var(--muted);font-size:1.45vh;letter-spacing:.18em;font-weight:900;margin-bottom:.9vh}.penalty-grid{display:grid;grid-template-columns:1fr 1fr;gap:.7vw}.penalty-side{background:rgba(255,255,255,.04);border:1px solid rgba(255,140,26,.22);border-radius:1.2vh;padding:.9vh .4vw}.penalty-side label{display:block;color:var(--muted);font-size:1.1vh;text-transform:uppercase;letter-spacing:.15em;font-weight:900}.penalty-time{display:block;font-family:Anton,Impact,sans-serif;font-size:3.3vh;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1}.penalty-time.active{color:var(--danger)}.audio-enable{position:absolute;left:1vw;bottom:.7vh;z-index:10;background:rgba(255,140,26,.95);color:#090909;border:0;border-radius:999px;padding:.9vh 1.1vw;font-weight:900;letter-spacing:.08em;cursor:pointer}.audio-enable.hidden{display:none}@keyframes shotPulse{0%,100%{transform:scale(1);text-shadow:0 0 18px rgba(255,50,50,.65)}50%{transform:scale(1.08);text-shadow:0 0 40px rgba(255,50,50,1)}}@keyframes buzzFlash{0%,100%{box-shadow:0 0 38px rgba(0,0,0,.45),inset 0 0 24px rgba(255,255,255,.035)}50%{box-shadow:0 0 55px rgba(255,50,50,.9),inset 0 0 42px rgba(255,50,50,.28);background:rgba(255,0,0,.38)}}.vs-pill{justify-self:center;background:linear-gradient(180deg,#1a1a1a,#050505);color:var(--orange);border:.18vh solid rgba(255,140,26,.75);border-radius:999px;padding:1vh 1.8vw;font-family:Anton,Impact,sans-serif;font-size:4.5vh;box-shadow:0 0 26px rgba(255,106,0,.32)}.possession{font-family:Anton,Impact,sans-serif;font-size:4vh;color:var(--white);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lower-third{z-index:1;display:grid;grid-template-columns:auto minmax(0,1.2fr) auto minmax(0,.75fr) minmax(0,1fr);align-items:center;gap:1.3vw;border-radius:2.2vh;padding:1.5vh 2vw;background:linear-gradient(90deg,rgba(0,0,0,.58),rgba(255,106,0,.14),rgba(255,138,29,.12))}.penalty-lower-label{color:var(--danger)}.penalty-lower{font-family:Anton,Impact,sans-serif;font-size:4.2vh;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}.penalty-lower.active{color:var(--danger);text-shadow:0 0 22px rgba(255,50,50,.7)}.ticker-main{font-family:Anton,Impact,sans-serif;font-size:5vh;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ticker-sub{text-align:right;font-size:3vh;font-weight:900;color:var(--white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.connection{position:absolute;right:1vw;bottom:.5vh;color:rgba(255,255,255,.35);font-size:1.2vh;letter-spacing:.12em}@media(max-width:900px){.scoreboard{grid-template-rows:auto auto auto;overflow:auto}.top-strip,.main-grid,.lower-third{grid-template-columns:1fr}.status-block,.ticker-sub{text-align:left}}

.team-identity{
  position:relative;
  display:block;
  margin-top:1.4vh;
  min-width:0;
}
.team-logo{
  width:8.5vw;
  height:8.5vw;
  display:none;
  align-items:center;
  justify-content:center;
  margin-bottom:1vh;
}
.away-panel .team-logo{
  margin-left:auto;
}
.team-logo img{
  max-width:100%;
  max-height:100%;
  object-fit:contain;
  filter:drop-shadow(0 .6vh 1.2vh rgba(0,0,0,.55));
}
.team-logo.has-logo{display:flex}
.team-identity.no-logo .team-logo{display:none}
.team-identity .team-name{
  max-width:100%;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  word-break:normal;
  overflow-wrap:normal;
  hyphens:none;
  font-size:clamp(42px,6.4vh,88px);
}


/* Logo/name layout fix: prevents weird wrapping with long team names. */
.team-panel{min-width:0}
.team-name{
  white-space:nowrap !important;
  overflow:hidden !important;
  text-overflow:ellipsis !important;
  word-break:normal !important;
  overflow-wrap:normal !important;
  hyphens:none !important;
}
.team-identity{min-width:0;width:100%}


/* v6 fix: keep shots / penalties / timeouts visible with logos enabled */
.team-panel{
  min-height:0 !important;
  grid-template-rows:auto auto minmax(0,1fr) auto !important;
  padding:2.2vh 2.1vw !important;
}

.team-identity{
  margin-top:1vh !important;
}

.team-logo{
  width:6.8vw !important;
  height:6.8vw !important;
  margin-bottom:.6vh !important;
}

.team-identity .team-name{
  font-size:clamp(34px,5.4vh,74px) !important;
  line-height:.95 !important;
}

.score-row{
  min-height:0 !important;
  align-items:center !important;
}

.score{
  font-size:clamp(120px,22vh,250px) !important;
}

.team-stats{
  display:grid !important;
  grid-template-columns:repeat(3,1fr) !important;
  gap:.65vw !important;
  margin-top:1vh !important;
  position:relative !important;
  z-index:5 !important;
}

.team-stats div{
  min-height:7.5vh !important;
  padding:.75vh .45vw !important;
  display:flex !important;
  flex-direction:column !important;
  align-items:center !important;
  justify-content:center !important;
}

.team-stats span{
  font-size:3.1vh !important;
  line-height:1 !important;
}

.team-stats label{
  font-size:1.15vh !important;
  line-height:1.1 !important;
}

/* Prevent the big score from covering the stats row on shorter OBS/browser windows */
@media (max-height: 850px){
  .team-logo{
    width:5.8vw !important;
    height:5.8vw !important;
  }
  .team-identity .team-name{
    font-size:clamp(30px,4.7vh,64px) !important;
  }
  .score{
    font-size:clamp(100px,19vh,220px) !important;
  }
  .team-stats div{
    min-height:6.5vh !important;
  }
}


/* ===== VIDEO BOARD LEGIBILITY UPGRADE ===== */

/* Make the period much larger and give it its own high-contrast badge */
.period{
  display:inline-block !important;
  font-family:Anton,Impact,sans-serif !important;
  font-size:3.6vh !important;
  line-height:1 !important;
  color:#050505 !important;
  background:var(--gold) !important;
  border:2px solid #ffffff !important;
  border-radius:.8vh !important;
  padding:.45vh 1.15vw !important;
  margin-bottom:.45vh !important;
  letter-spacing:.11em !important;
  text-shadow:none !important;
  box-shadow:0 0 24px rgba(255,179,71,.75) !important;
}

/* Make team records brighter, larger, and boxed */
.record{
  display:inline-block !important;
  min-width:5.2vw !important;
  text-align:center !important;
  font-family:Anton,Impact,sans-serif !important;
  font-size:2.8vh !important;
  line-height:1 !important;
  color:#ffffff !important;
  background:#000000 !important;
  border:2px solid var(--gold) !important;
  border-radius:.7vh !important;
  padding:.55vh .75vw !important;
  letter-spacing:.08em !important;
  text-shadow:0 0 12px rgba(255,255,255,.28) !important;
  box-shadow:0 0 18px rgba(255,140,26,.45) !important;
}

/* Give the HOME / AWAY labels more contrast too */
.team-meta{
  color:#ffffff !important;
  font-size:2.15vh !important;
  text-shadow:0 0 10px rgba(0,0,0,.9) !important;
}

/* Rebuild the lower third so penalty information has its own dominant area */
.lower-third{
  grid-template-columns:auto minmax(0,.9fr) auto minmax(0,1.55fr) minmax(0,.7fr) !important;
  gap:1vw !important;
  padding:1.2vh 1.6vw !important;
  background:
    linear-gradient(90deg,
      rgba(0,0,0,.96) 0%,
      rgba(30,18,8,.96) 42%,
      rgba(55,0,0,.96) 64%,
      rgba(0,0,0,.96) 100%) !important;
  border:2px solid rgba(255,140,26,.6) !important;
}

/* Make all lower-third labels easier to read */
.ticker-label{
  font-size:1.9vh !important;
  color:#ffffff !important;
  letter-spacing:.14em !important;
  text-shadow:0 0 10px rgba(0,0,0,.9) !important;
}

/* Last goal stays readable, but penalty becomes the visual priority */
.ticker-main{
  font-size:4.1vh !important;
  color:#ffffff !important;
  text-shadow:0 0 14px rgba(255,255,255,.18) !important;
}

.penalty-lower-label{
  display:inline-block !important;
  color:#ffffff !important;
  background:var(--danger) !important;
  border:2px solid #ffffff !important;
  border-radius:.7vh !important;
  padding:.55vh .8vw !important;
  box-shadow:0 0 22px rgba(255,50,50,.75) !important;
}

.penalty-lower{
  font-size:5.2vh !important;
  color:#ffffff !important;
  background:#5a0000 !important;
  border:3px solid var(--danger) !important;
  border-radius:1vh !important;
  padding:.65vh 1vw !important;
  text-align:center !important;
  overflow:visible !important;
  text-overflow:clip !important;
  text-shadow:0 0 18px rgba(255,255,255,.22) !important;
  box-shadow:
    0 0 30px rgba(255,50,50,.75),
    inset 0 0 18px rgba(255,255,255,.08) !important;
}

.penalty-lower.active{
  color:#ffffff !important;
  background:#7a0000 !important;
  animation:penaltyPulse 1s ease-in-out infinite !important;
}

@keyframes penaltyPulse{
  0%,100%{
    box-shadow:
      0 0 24px rgba(255,50,50,.55),
      inset 0 0 14px rgba(255,255,255,.06);
  }
  50%{
    box-shadow:
      0 0 42px rgba(255,50,50,1),
      inset 0 0 24px rgba(255,255,255,.12);
  }
}

.ticker-sub{
  font-size:2.5vh !important;
  color:#ffffff !important;
  text-shadow:0 0 10px rgba(0,0,0,.9) !important;
}

/* Additional contrast for the top strip when projected */
.top-strip{
  background:
    linear-gradient(90deg,
      rgba(70,25,0,.96),
      rgba(0,0,0,.96) 36%,
      rgba(0,0,0,.96) 64%,
      rgba(70,25,0,.96)) !important;
  border:2px solid rgba(255,140,26,.55) !important;
}

.game-clock-card{
  border:.45vh solid var(--gold) !important;
  box-shadow:
    0 0 30px rgba(255,179,71,.55),
    inset 0 0 18px rgba(255,255,255,.04) !important;
}

/* Keep the same improvements on shorter projector windows */
@media (max-height:850px){
  .period{
    font-size:3.2vh !important;
  }
  .record{
    font-size:2.45vh !important;
  }
  .penalty-lower{
    font-size:4.6vh !important;
  }
  .ticker-main{
    font-size:3.7vh !important;
  }
}


/* ===== EXTRA VIDEO BOARD FONT BOOST ===== */
.period{
  font-size:4.3vh !important;
  padding:.55vh 1.35vw !important;
}

.record{
  font-size:3.4vh !important;
  min-width:6.5vw !important;
  padding:.65vh 1vw !important;
}

.team-meta{
  font-size:2.5vh !important;
}

.ticker-label{
  font-size:2.3vh !important;
}

.ticker-main{
  font-size:4.8vh !important;
}

.penalty-lower-label{
  font-size:2.2vh !important;
  padding:.7vh 1vw !important;
}

.penalty-lower{
  font-size:6.2vh !important;
  padding:.8vh 1.2vw !important;
}

.ticker-sub{
  font-size:3.0vh !important;
}

@media (max-height:850px){
  .period{font-size:3.8vh !important;}
  .record{font-size:3.0vh !important;}
  .penalty-lower{font-size:5.5vh !important;}
  .ticker-main{font-size:4.3vh !important;}
}


/* ===== BOXSTRONG ARENA FOOTER V2 ===== */
.scoreboard{
  grid-template-rows:15vh minmax(0,1fr) 18vh !important;
}

.arena-footer{
  z-index:2;
  display:grid;
  grid-template-rows:minmax(0,1.08fr) minmax(0,.92fr);
  gap:.65vh;
  min-height:0;
}

.penalty-banner,
.info-bar{
  border:2px solid rgba(255,140,26,.6);
  box-shadow:
    0 0 34px rgba(0,0,0,.6),
    inset 0 0 22px rgba(255,255,255,.035);
  backdrop-filter:blur(10px);
}

.penalty-banner{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:stretch;
  border-radius:1.7vh 1.7vh .8vh .8vh;
  overflow:hidden;
  background:
    linear-gradient(90deg,#280000 0%,#5f0000 45%,#8b0000 72%,#210000 100%);
  border-color:rgba(255,60,60,.92);
  box-shadow:
    0 0 34px rgba(255,40,40,.38),
    inset 0 0 24px rgba(255,255,255,.045);
}

.penalty-left{
  display:grid;
  grid-template-columns:auto minmax(0,1fr);
  align-items:center;
  gap:1.2vw;
  padding:1.15vh 1.5vw;
  min-width:0;
}

.penalty-alert{
  font-family:Anton,Impact,sans-serif;
  font-size:4.4vh;
  line-height:1;
  letter-spacing:.08em;
  color:#fff;
  background:var(--danger);
  border:3px solid #fff;
  border-radius:.8vh;
  padding:.65vh 1vw;
  text-shadow:0 0 10px rgba(0,0,0,.7);
  box-shadow:0 0 24px rgba(255,50,50,.85);
}

.penalty-detail{
  font-family:Anton,Impact,sans-serif;
  font-size:4.7vh;
  line-height:1;
  color:#fff;
  letter-spacing:.035em;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  text-shadow:0 0 16px rgba(0,0,0,.85);
}

.penalty-right{
  min-width:19vw;
  display:flex;

  font-size:6.8vh;

  color:#fff;
  letter-spacing:.04em;
  font-variant-numeric:tabular-nums;
  text-shadow:0 0 24px rgba(255,255,255,.24);
}

.penalty-status{
  margin-top:.45vh;
  color:#ffd8d8;
  font-size:1.7vh;
  font-weight:900;
  letter-spacing:.17em;
  text-transform:uppercase;
}

.penalty-banner.inactive{
  background:
    linear-gradient(90deg,rgba(8,8,10,.98),rgba(30,18,8,.96),rgba(8,8,10,.98));
  border-color:rgba(255,140,26,.5);
  box-shadow:
    0 0 28px rgba(0,0,0,.55),
    inset 0 0 18px rgba(255,255,255,.025);
}

.penalty-banner.inactive .penalty-alert{
  background:#161616;
  border-color:var(--gold);
  color:var(--gold);
  box-shadow:0 0 18px rgba(255,179,71,.35);
}

.penalty-banner.active{

}

@keyframes arenaPenaltyPulse{
  0%,100%{
    box-shadow:
      0 0 30px rgba(255,40,40,.38),
      inset 0 0 20px rgba(255,255,255,.04);
  }
  50%{
    box-shadow:
      0 0 52px rgba(255,40,40,.92),
      inset 0 0 32px rgba(255,255,255,.09);
  }
}

.info-bar{
  display:grid;
  grid-template-columns:minmax(0,1.45fr) 2px minmax(0,1fr) 2px minmax(0,.72fr);
  align-items:center;
  gap:1.1vw;
  border-radius:.8vh .8vh 1.7vh 1.7vh;
  padding:.7vh 1.35vw;
  background:
    linear-gradient(90deg,rgba(0,0,0,.98),rgba(50,24,5,.96),rgba(0,0,0,.98));

.info-block{
  min-width:0;
}

.info-label{
  color:var(--gold);
  font-size:1.65vh;

  letter-spacing:.18em;
  text-transform:uppercase;
  margin-bottom:.22vh;
}

.info-value{
  font-family:Anton,Impact,sans-serif;
  font-size:3.8vh;
  line-height:1;
  color:#fff;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  letter-spacing:.025em;
}

.info-note{
  color:#fff;
}

.league-block{
  text-align:right;
}

.league-value{
  color:var(--orange);
}

.info-divider{
  width:2px;
  height:72%;

/* Prevent the old lower-third styles from affecting the new layout */
.lower-third{display:none !important;}

@media(max-height:850px){
  .scoreboard{
    grid-template-rows:14vh minmax(0,1fr) 17vh !important;

<script>
const defaultState = {
  leagueTitle: "BOXSTRONG",
  gameStatus: "LIVE",
  period: "Q1",
  gameClock: "12:00",
  shotClock: "30",
  homeTeam: "SABRETOOTHS",
  awayTeam: "PHOENIX",
  homeLogo: "",
  awayLogo: "",
  homeRecord: "0-0",
  awayRecord: "0-0",
  homeScore: 0,
  awayScore: 0,
  homeShots: 0,
  awayShots: 0,
  homePenalties: 0,
  awayPenalties: 0,
  homePenaltyTime: "--",
  awayPenaltyTime: "--",
  homeTimeouts: 2,
  awayTimeouts: 2,
  possession: "--",
  lastGoal: "--",
  note: "Week 1 Matchup",
  connection: "FIREBASE LIVE"
};

function getQueryParam(name) {
  return new URLSearchParams(window.location.search).get(name);
}

const SCOREBOARD_GAME_ID = getQueryParam("game") || window.BEASTAVE_DEFAULT_GAME_ID || "week-1";
let currentState = { ...defaultState };

function mmssToSeconds(value) {
  const parts = String(value || "0:00").split(":").map(Number);
  if (parts.length !== 2 || parts.some(Number.isNaN)) return 0;
  return Math.max(0, parts[0] * 60 + parts[1]);
}

function secondsToMmss(total) {
  const safe = Math.max(0, Number(total) || 0);
  const minutes = Math.floor(safe / 60);
  const seconds = safe % 60;
  return `${minutes}:${String(seconds).padStart(2, "0")}`;
}

function clampNumber(value, min = 0, max = 999) {
  return Math.min(max, Math.max(min, Number(value) || 0));
}

function requireFirebaseConfig() {
  if (!window.BEASTAVE_FIREBASE_CONFIG || !window.BEASTAVE_FIREBASE_CONFIG.apiKey) {
    throw new Error("Missing Firebase config. Open firebase-config.js and paste your Firebase web app config.");
  }
}

function initFirebaseScoreboard(onStateChange) {
  requireFirebaseConfig();

  if (!firebase.apps.length) {
    firebase.initializeApp(window.BEASTAVE_FIREBASE_CONFIG);
  }

  const db = firebase.database();
  const gameRef = db.ref(`scoreboards/${SCOREBOARD_GAME_ID}`);

  gameRef.on("value", async (snapshot) => {
    const data = snapshot.val();

    if (!data) {
      await gameRef.set({
        ...defaultState,
        createdAt: firebase.database.ServerValue.TIMESTAMP,
        updatedAt: firebase.database.ServerValue.TIMESTAMP
      });
      return;
    }

    currentState = { ...defaultState, ...data, connection: `FIREBASE LIVE · ${SCOREBOARD_GAME_ID}` };
    if (typeof onStateChange === "function") onStateChange(currentState);
  }, (error) => {
    console.error("Firebase listener error:", error);
    currentState = { ...currentState, connection: "FIREBASE ERROR" };
    if (typeof onStateChange === "function") onStateChange(currentState);
  });

  return gameRef;
}

function updateFirebaseState(patch) {
  if (!window.beastAveGameRef) {
    console.error("Firebase game ref is not ready yet.");
    return Promise.reject(new Error("Firebase game ref is not ready yet."));
  }

  return window.beastAveGameRef.update({
    ...patch,
    updatedAt: firebase.database.ServerValue.TIMESTAMP
  });
}

function getScoreboardState() {
  return { ...currentState };
}
</script>
<script>

function unlockArenaAudio() {

  const sounds = [buzzer, periodHorn].filter(Boolean);
  if (!sounds.length) return;

  Promise.all(sounds.map((sound) => {
    sound.volume = 1;
    return sound.play().then(() => {
      sound.pause();
      sound.currentTime = 0;
    });
  })).then(() => {
    audioUnlocked = true;
    if (button) button.classList.add("hidden");
  }).catch((error) => {
    console.warn("Audio unlock blocked:", error);
    if (button) button.textContent = "CLICK AGAIN TO ENABLE AUDIO";
  });
}

function playShotClockBuzzer() {
  const buzzer = document.getElementById("shotClockBuzzer");
  const shotCard = document.getElementById("shotClockCard");
  if (shotCard) {
    shotCard.classList.remove("buzz");
    void shotCard.offsetWidth;
    shotCard.classList.add("buzz");
  }
  if (!buzzer) return;
  buzzer.volume = 1;
  buzzer.pause();
  buzzer.currentTime = 0;
  buzzer.play().catch((error) => console.warn("Buzzer playback blocked:", error));
}


function playPeriodHorn() {
  const horn = document.getElementById("periodHorn");
  const clockCard = document.querySelector(".game-clock-card");
  if (clockCard) {
    clockCard.classList.remove("buzz");
    void clockCard.offsetWidth;
    clockCard.classList.add("buzz");
  }
  if (!horn) return;
  horn.volume = 1;
  horn.pause();
  horn.currentTime = 0;
  horn.play().catch((error) => console.warn("Period horn playback blocked:", error));
}

function isActivePenalty(value) {
  return value && value !== "--" && value !== "0:00" && value !== "00" && value !== "0";
}

function updateLogo(side, logoPath) {
  const img = document.getElementById(side + "LogoImg");
  const wrap = document.getElementById(side + "LogoWrap");
  const identity = document.getElementById(side + "Identity");

  if (!img || !wrap || !identity) return;

  if (logoPath && logoPath.trim()) {
    img.src = logoPath.trim();
    wrap.classList.add("has-logo");
    identity.classList.remove("no-logo");
  } else {
    img.removeAttribute("src");
    wrap.classList.remove("has-logo");
    identity.classList.add("no-logo");
  }
}

function renderDisplay(state) {
  document.querySelectorAll("[data-field]").forEach((el) => {
    const key = el.dataset.field;
    if (key in state) el.textContent = state[key];
  });

  updateLogo("home", state.homeLogo);
  updateLogo("away", state.awayLogo);

  const shotCard = document.getElementById("shotClockCard");
  const shot = Number(state.shotClock);
  if (shotCard) {
    shotCard.classList.toggle("warning", shot <= 10 && shot > 5);
    shotCard.classList.toggle("critical", shot <= 5 && shot > 0);
    shotCard.classList.toggle("expired", shot === 0);

    if (previousShotClock !== null && previousShotClock > 0 && shot === 0) {
      playShotClockBuzzer();
    }
    previousShotClock = shot;
  }

  const gameClockSeconds = mmssToSeconds(state.gameClock);
  if (previousGameClockSeconds !== null && previousGameClockSeconds > 0 && gameClockSeconds === 0) {
    playPeriodHorn();
  }
  previousGameClockSeconds = gameClockSeconds;

  const penaltyBanner = document.getElementById("penaltyBanner");
  const penaltyDetail = document.getElementById("penaltyDetail");
  const penaltyClock = document.getElementById("penaltyClock");
  const penaltyStatus = document.getElementById("penaltyStatus");

  if (penaltyBanner && penaltyDetail && penaltyClock && penaltyStatus) {
    const homeActive = isActivePenalty(state.homePenaltyTime);
    const awayActive = isActivePenalty(state.awayPenaltyTime);
    const homeLabel = String(state.homeTeam || "HOME").toUpperCase();
    const awayLabel = String(state.awayTeam || "AWAY").toUpperCase();

    penaltyBanner.classList.toggle("active", homeActive || awayActive);
    penaltyBanner.classList.toggle("inactive", !(homeActive || awayActive));

    if (homeActive && awayActive) {
      penaltyDetail.textContent = `${homeLabel} AND ${awayLabel}`;
      penaltyClock.textContent = `${state.homePenaltyTime} | ${state.awayPenaltyTime}`;
      penaltyStatus.textContent = "MATCHING PENALTIES";
    } else if (homeActive) {
      penaltyDetail.textContent = `${homeLabel} PENALTY`;
      penaltyClock.textContent = state.homePenaltyTime;
      penaltyStatus.textContent = `${awayLabel} POWER PLAY`;
    } else if (awayActive) {
      penaltyDetail.textContent = `${awayLabel} PENALTY`;
      penaltyClock.textContent = state.awayPenaltyTime;
      penaltyStatus.textContent = `${homeLabel} POWER PLAY`;
    } else {
      penaltyDetail.textContent = "NO ACTIVE PENALTY";
      penaltyClock.textContent = "--";
      penaltyStatus.textContent = "EVEN STRENGTH";
    }
  }
}

document.addEventListener("DOMContentLoaded", () => {
  const audioButton = document.getElementById("enableAudioButton");
  if (audioButton) audioButton.addEventListener("click", unlockArenaAudio);
  document.addEventListener("click", () => { audioUnlocked = true; }, { once: true });
  document.addEventListener("keydown", () => { audioUnlocked = true; }, { once: true });
  try {
    window.beastAveGameRef = initFirebaseScoreboard(renderDisplay);
    renderDisplay(getScoreboardState());
  } catch (error) {
    console.error(error);
    document.querySelectorAll("[data-field='connection']").forEach((el) => {
      el.textContent = "CONFIG ERROR";
    });
    alert(error.message);
  }
});
</script>
