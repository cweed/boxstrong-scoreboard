<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>East Ave U8 Lacrosse Scoreboard</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@600;700;800;900&display=swap');

    :root{
      --black:#030303;
      --black2:#0a0b0d;
      --panel:#101318;
      --panel2:#151922;
      --orange:#ff6a00;
      --orange2:#ff8c1a;
      --white:#ffffff;
      --muted:#aeb5bf;
      --line:rgba(255,255,255,.14);
      --orangeLine:rgba(255,106,0,.48);
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
      background:#000;
      color:var(--white);
      font-family:Inter,Arial,sans-serif;
    }

    body{
      background:
        radial-gradient(circle at 50% -10%,rgba(255,106,0,.18),transparent 34%),
        linear-gradient(180deg,#020202 0%,#090a0d 55%,#030303 100%);
    }

    .scoreboard{
      width:100vw;
      height:100vh;
      padding:2.2vh 2.2vw;
      display:grid;
      grid-template-rows:13vh 1fr 13vh;
      gap:1.8vh;
      position:relative;
    }

    .scoreboard::before{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background:
        linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
      background-size:10px 10px;
      opacity:.45;
      mask-image:linear-gradient(to bottom,transparent 0%,black 18%,black 85%,transparent 100%);
    }

    .panel{
      border:1px solid var(--orangeLine);
      box-shadow:
        0 0 28px rgba(0,0,0,.65),
        inset 0 0 22px rgba(255,255,255,.025);
      background:
        linear-gradient(180deg,rgba(20,23,29,.96),rgba(8,9,12,.98));
      position:relative;
      z-index:1;
    }

    .header{
      border-radius:1.6vh;
      display:grid;
      grid-template-columns:1fr auto 1fr;
      align-items:center;
      padding:1.3vh 1.4vw;
      overflow:hidden;
    }

    .header::after{
      content:"";
      position:absolute;
      left:0;
      right:0;
      bottom:0;
      height:.35vh;
      background:linear-gradient(90deg,transparent,var(--orange),transparent);
      box-shadow:0 0 18px rgba(255,106,0,.7);
    }

    .brand{
      display:flex;
      align-items:center;
      gap:1vw;
      min-width:0;
    }

    .brand-logo{
      width:8.4vh;
      height:8.4vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#050505;
      border:1px solid rgba(255,106,0,.5);
      border-radius:1vh;
      padding:.6vh;
      box-shadow:0 0 22px rgba(255,106,0,.24);
      flex:0 0 auto;
    }

    .brand-logo img{
      max-width:100%;
      max-height:100%;
      object-fit:contain;
      display:block;
    }

    .eyebrow,
    .team-side,
    .stat-label,
    .status-label,
    .footer-label{
      color:var(--muted);
      font-size:1.3vh;
      font-weight:900;
      letter-spacing:.2em;
      text-transform:uppercase;
    }

    .brand-title{
      font-family:Anton,Impact,sans-serif;
      font-size:4.8vh;
      line-height:.95;
      letter-spacing:.055em;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .league-sub{
      margin-top:.35vh;
      color:var(--orange2);
      font-size:1.55vh;
      font-weight:900;
      letter-spacing:.18em;
      text-transform:uppercase;
    }

    .header-center{
      text-align:center;
      padding:0 2.5vw;
    }

    .header-center .eyebrow{margin-bottom:.35vh}

    .header-center strong{
      font-family:Anton,Impact,sans-serif;
      font-size:3.5vh;
      letter-spacing:.08em;
      color:var(--white);
      white-space:nowrap;
    }

    .status{
      text-align:right;
      min-width:0;
    }

    .status-value{
      font-family:Anton,Impact,sans-serif;
      font-size:4vh;
      color:var(--orange2);
      letter-spacing:.08em;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .main-board{
      border-radius:1.8vh;
      display:grid;
      grid-template-columns:minmax(0,1fr) 30vw minmax(0,1fr);
      grid-template-rows:auto 1fr;
      overflow:hidden;
      min-height:0;
    }

    .team-header{
      grid-row:1;
      padding:1.2vh 1.4vw;
      border-bottom:1px solid var(--line);
      background:linear-gradient(180deg,rgba(255,106,0,.15),rgba(0,0,0,.08));
      min-width:0;
    }

    .team-header.home{grid-column:1}
    .clock-header{grid-column:2;grid-row:1}
    .team-header.away{grid-column:3;text-align:right}

    .team-name{
      font-family:Anton,Impact,sans-serif;
      font-size:4.2vh;
      line-height:1;
      letter-spacing:.055em;
      text-transform:uppercase;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .record{
      margin-top:.4vh;
      color:var(--muted);
      font-size:1.45vh;
      font-weight:900;
      letter-spacing:.14em;
    }

    .clock-header{
      padding:1vh 1vw;
      border-left:1px solid var(--line);
      border-right:1px solid var(--line);
      border-bottom:1px solid var(--line);
      text-align:center;
      background:rgba(0,0,0,.42);
    }

    .period{
      color:var(--orange2);
      font-weight:900;
      font-size:1.8vh;
      letter-spacing:.2em;
      text-transform:uppercase;
    }

    .score-column{
      grid-row:2;
      display:grid;
      grid-template-rows:minmax(0,1fr) auto;
      min-width:0;
      min-height:0;
    }

    .home-score-column{grid-column:1}
    .center-column{
      grid-column:2;
      grid-row:2;
      border-left:1px solid var(--line);
      border-right:1px solid var(--line);
      display:grid;
      grid-template-rows:auto 1fr;
      min-height:0;
      background:rgba(0,0,0,.2);
    }
    .away-score-column{grid-column:3}

    .score-box{
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:0;
      padding:1vh;
      background:
        linear-gradient(180deg,rgba(255,255,255,.03),transparent 28%),
        radial-gradient(circle at center,rgba(255,106,0,.07),transparent 64%);
    }

    .score{
      font-family:Anton,Impact,sans-serif;
      font-size:clamp(180px,35vh,390px);
      line-height:.78;
      font-variant-numeric:tabular-nums;
      color:#fff;
      text-shadow:
        0 0 2px #fff,
        0 0 22px rgba(255,255,255,.09),
        0 1.1vh 3vh rgba(0,0,0,.8);
    }

    .team-logo-row{
      min-height:9vh;
      display:flex;
      align-items:center;
      gap:1vw;
      padding:1vh 1.2vw;
      border-top:1px solid var(--line);
      background:rgba(0,0,0,.33);
    }

    .away-score-column .team-logo-row{
      justify-content:flex-end;
      text-align:right;
    }

    .team-logo{
      width:6.6vh;
      height:6.6vh;
      display:none;
      align-items:center;
      justify-content:center;
      border:1px solid rgba(255,106,0,.28);
      border-radius:.8vh;
      background:#060606;
      padding:.45vh;
    }

    .team-logo.has-logo{display:flex}

    .team-logo img{
      max-width:100%;
      max-height:100%;
      object-fit:contain;
    }

    .team-caption{
      font-weight:900;
      font-size:1.55vh;
      letter-spacing:.13em;
      text-transform:uppercase;
      color:var(--muted);
    }

    .clock-block{
      padding:2.3vh 1.2vw 1.7vh;
      text-align:center;
      border-bottom:1px solid var(--line);
    }

    .game-clock{
      font-family:Anton,Impact,sans-serif;
      font-size:10.8vh;
      line-height:.9;
      letter-spacing:.04em;
      font-variant-numeric:tabular-nums;
      color:var(--white);
      background:#050505;
      border:.28vh solid var(--orange);
      border-radius:1.2vh;
      padding:1.25vh .6vw;
      box-shadow:
        0 0 26px rgba(255,106,0,.25),
        inset 0 0 20px rgba(255,255,255,.025);
    }

    .clock-block.period-end .game-clock{
      animation:clockFlash .35s ease-in-out 6;
    }

    @keyframes clockFlash{
      0%,100%{
        background:#050505;
        color:#fff;
        box-shadow:0 0 26px rgba(255,106,0,.25)
      }
      50%{
        background:var(--orange);
        color:#080808;
        box-shadow:0 0 48px rgba(255,106,0,.95)
      }
    }

    .stats{
      display:grid;
      grid-template-rows:repeat(4,1fr);
      min-height:0;
      padding:1.1vh 1.2vw;
      gap:.65vh;
    }

    .stat-row{
      display:grid;
      grid-template-columns:1fr 1.6fr 1fr;
      align-items:center;
      border-bottom:1px solid rgba(255,255,255,.08);
      min-height:0;
    }

    .stat-row:last-child{border-bottom:0}

    .stat-value{
      font-family:Anton,Impact,sans-serif;
      font-size:3.5vh;
      line-height:1;
      font-variant-numeric:tabular-nums;
      text-align:center;
    }

    .stat-label{
      text-align:center;
      color:#fff;
      font-size:1.25vh;
      letter-spacing:.12em;
    }

    .footer{
      border-radius:1.6vh;
      display:grid;
      grid-template-columns:auto minmax(0,1.35fr) auto minmax(0,.85fr);
      align-items:center;
      gap:1.2vw;
      padding:1.35vh 1.6vw;
      background:
        linear-gradient(90deg,rgba(0,0,0,.75),rgba(255,106,0,.13),rgba(0,0,0,.75));
    }

    .footer-main{
      font-family:Anton,Impact,sans-serif;
      font-size:4.2vh;
      color:var(--orange2);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .footer-note{
      text-align:right;
      font-size:2.55vh;
      font-weight:900;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .audio-enable{
      position:absolute;
      left:1vw;
      bottom:.45vh;
      z-index:20;
      border:0;
      border-radius:999px;
      background:var(--orange);
      color:#080808;
      padding:.75vh 1vw;
      font-weight:900;
      letter-spacing:.07em;
      cursor:pointer;
    }

    .audio-enable.hidden{display:none}

    .connection{
      position:absolute;
      right:1vw;
      bottom:.45vh;
      color:rgba(255,255,255,.34);
      font-size:1.05vh;
      letter-spacing:.12em;
    }

    @media(max-height:850px){
      .scoreboard{grid-template-rows:12vh 1fr 11.5vh}
      .score{font-size:clamp(145px,31vh,330px)}
      .game-clock{font-size:9vh}
      .team-name{font-size:3.7vh}
    }

    @media(max-width:900px){
      .scoreboard{
        overflow:auto;
        grid-template-rows:auto auto auto;
      }

      .header,.main-board,.footer{
        grid-template-columns:1fr;
      }

      .main-board{
        grid-template-rows:auto auto auto auto auto auto;
      }

      .team-header.home,
      .clock-header,
      .team-header.away,
      .home-score-column,
      .center-column,
      .away-score-column{
        grid-column:1;
      }

      .team-header.home{grid-row:1}
      .home-score-column{grid-row:2}
      .clock-header{grid-row:3}
      .center-column{grid-row:4}
      .team-header.away{grid-row:5}
      .away-score-column{grid-row:6}

      .status,.team-header.away,.footer-note{text-align:left}
      .center-column{border-left:0;border-right:0}
    }
  </style>
</head>

<body>
  <main class="scoreboard">

    <section class="header panel">
      <div class="brand">
        <div class="brand-logo">
          <img
            src="https://img.pagecloud.com/agw60AFaRvUPN0fmzLBgfoWAgp0=/124x0/filters:no_upscale()/eastavelacrosse/EA_logo_beast.head_rgb.png"
            alt="East Ave Lacrosse logo">
        </div>

        <div>
          <div class="eyebrow">East Ave Lacrosse</div>
          <div class="brand-title" data-field="leagueTitle">EAST AVE U8</div>
          <div class="league-sub">Game Day Scoreboard</div>
        </div>
      </div>

      <div class="header-center">
        <div class="eyebrow">Indoor Lacrosse</div>
        <strong>U8 MATCHUP</strong>
      </div>

      <div class="status">
        <div class="status-label">Game Status</div>
        <div class="status-value" data-field="gameStatus">LIVE</div>
      </div>
    </section>

    <section class="main-board panel">

      <div class="team-header home">
        <div class="team-side">Home</div>
        <div class="team-name" data-field="homeTeam">HOME</div>
        <div class="record" data-field="homeRecord">0-0</div>
      </div>

      <div class="clock-header">
        <div class="period" data-field="period">Q1</div>
      </div>

      <div class="team-header away">
        <div class="team-side">Away</div>
        <div class="team-name" data-field="awayTeam">AWAY</div>
        <div class="record" data-field="awayRecord">0-0</div>
      </div>

      <div class="score-column home-score-column">
        <div class="score-box">
          <div class="score" data-field="homeScore">0</div>
        </div>

        <div class="team-logo-row">
          <div class="team-logo" id="homeLogoWrap">
            <img id="homeLogoImg" alt="Home team logo">
          </div>
          <div class="team-caption" data-field="homeTeam">HOME</div>
        </div>
      </div>

      <div class="center-column">
        <div class="clock-block" id="clockBlock">
          <div class="game-clock" data-field="gameClock">12:00</div>
        </div>

        <div class="stats">
          <div class="stat-row">
            <div class="stat-value" data-field="homeShots">0</div>
            <div class="stat-label">Shots</div>
            <div class="stat-value" data-field="awayShots">0</div>
          </div>

          <div class="stat-row">
            <div class="stat-value" data-field="homePenalties">0</div>
            <div class="stat-label">Penalties</div>
            <div class="stat-value" data-field="awayPenalties">0</div>
          </div>

          <div class="stat-row">
            <div class="stat-value" data-field="homeTimeouts">2</div>
            <div class="stat-label">Timeouts</div>
            <div class="stat-value" data-field="awayTimeouts">2</div>
          </div>

          <div class="stat-row">
            <div class="stat-value">—</div>
            <div class="stat-label">Possession</div>
            <div class="stat-value" data-field="possession">--</div>
          </div>
        </div>
      </div>

      <div class="score-column away-score-column">
        <div class="score-box">
          <div class="score" data-field="awayScore">0</div>
        </div>

        <div class="team-logo-row">
          <div class="team-caption" data-field="awayTeam">AWAY</div>
          <div class="team-logo" id="awayLogoWrap">
            <img id="awayLogoImg" alt="Away team logo">
          </div>
        </div>
      </div>
    </section>

    <section class="footer panel">
      <div class="footer-label">Last Goal</div>
      <div class="footer-main" data-field="lastGoal">--</div>
      <div class="footer-label">Game Note</div>
      <div class="footer-note" data-field="note">East Ave U8 Lacrosse</div>
    </section>

    <button class="audio-enable" id="enableAudioButton" type="button">
      ENABLE ARENA AUDIO
    </button>

    <div class="connection" data-field="connection">LOCAL CONTROL</div>
  </main>

  <audio
    id="periodHorn"
    preload="auto"
    crossorigin="anonymous"
    src="https://cweed.github.io/boxstrong-scoreboard/Sounds/nhl-end-of-period-sound.mp3">
  </audio>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>

  <script>
    const defaultState = {
      leagueTitle: "EAST AVE U8",
      gameStatus: "LIVE",
      period: "Q1",
      gameClock: "12:00",

      // Retained for compatibility with the existing operator page.
      shotClock: "30",

      homeTeam: "HOME",
      awayTeam: "AWAY",
      homeLogo: "",
      awayLogo: "",
      homeRecord: "0-0",
      awayRecord: "0-0",
      homeScore: 0,
      awayScore: 0,
      homeShots: 0,
      awayShots: 0,
      homePenalties: 0,
      awayPenalties: 0,
      homeTimeouts: 2,
      awayTimeouts: 2,
      possession: "--",
      lastGoal: "--",
      note: "East Ave U8 Lacrosse",
      connection: "FIREBASE LIVE"
    };

    function getQueryParam(name){
      return new URLSearchParams(window.location.search).get(name);
    }

    const SCOREBOARD_GAME_ID =
      getQueryParam("game") ||
      window.BEASTAVE_DEFAULT_GAME_ID ||
      "week-1";

    let currentState = { ...defaultState };

    function mmssToSeconds(value){
      const parts = String(value || "0:00").split(":").map(Number);
      if(parts.length !== 2 || parts.some(Number.isNaN)) return 0;
      return Math.max(0,parts[0] * 60 + parts[1]);
    }

    function requireFirebaseConfig(){
      if(!window.BEASTAVE_FIREBASE_CONFIG || !window.BEASTAVE_FIREBASE_CONFIG.apiKey){
        throw new Error(
          "Missing Firebase config. Open firebase-config.js and paste your Firebase web app config."
        );
      }
    }

    function initFirebaseScoreboard(onStateChange){
      requireFirebaseConfig();

      if(!firebase.apps.length){
        firebase.initializeApp(window.BEASTAVE_FIREBASE_CONFIG);
      }

      const db = firebase.database();
      const gameRef = db.ref(`scoreboards/${SCOREBOARD_GAME_ID}`);

      gameRef.on(
        "value",
        async(snapshot)=>{
          const data = snapshot.val();

          if(!data){
            await gameRef.set({
              ...defaultState,
              createdAt:firebase.database.ServerValue.TIMESTAMP,
              updatedAt:firebase.database.ServerValue.TIMESTAMP
            });
            return;
          }

          currentState = {
            ...defaultState,
            ...data,
            connection:`FIREBASE LIVE · ${SCOREBOARD_GAME_ID}`
          };

          if(typeof onStateChange === "function"){
            onStateChange(currentState);
          }
        },
        (error)=>{
          console.error("Firebase listener error:",error);
          currentState = {...currentState,connection:"FIREBASE ERROR"};

          if(typeof onStateChange === "function"){
            onStateChange(currentState);
          }
        }
      );

      return gameRef;
    }

    function updateFirebaseState(patch){
      if(!window.eastAveGameRef){
        return Promise.reject(new Error("Firebase game reference is not ready yet."));
      }

      return window.eastAveGameRef.update({
        ...patch,
        updatedAt:firebase.database.ServerValue.TIMESTAMP
      });
    }

    function getScoreboardState(){
      return {...currentState};
    }
  </script>

  <script>
    let previousGameClockSeconds = null;

    function updateLogo(side,logoPath){
      const image = document.getElementById(`${side}LogoImg`);
      const wrapper = document.getElementById(`${side}LogoWrap`);

      if(!image || !wrapper) return;

      if(logoPath && String(logoPath).trim()){
        image.src = String(logoPath).trim();
        wrapper.classList.add("has-logo");
      }else{
        image.removeAttribute("src");
        wrapper.classList.remove("has-logo");
      }
    }

    function playPeriodHorn(){
      const horn = document.getElementById("periodHorn");
      const clockBlock = document.getElementById("clockBlock");

      if(clockBlock){
        clockBlock.classList.remove("period-end");
        void clockBlock.offsetWidth;
        clockBlock.classList.add("period-end");
      }

      if(!horn) return;

      horn.volume = 1;
      horn.pause();
      horn.currentTime = 0;

      horn.play().catch((error)=>{
        console.warn("Period horn playback blocked:",error);
      });
    }

    function unlockArenaAudio(){
      const horn = document.getElementById("periodHorn");
      const button = document.getElementById("enableAudioButton");

      if(!horn) return;

      horn.volume = 1;

      horn.play()
        .then(()=>{
          horn.pause();
          horn.currentTime = 0;
          if(button) button.classList.add("hidden");
        })
        .catch((error)=>{
          console.warn("Audio unlock blocked:",error);
          if(button) button.textContent = "CLICK AGAIN TO ENABLE AUDIO";
        });
    }

    function renderDisplay(state){
      document.querySelectorAll("[data-field]").forEach((element)=>{
        const key = element.dataset.field;
        if(key in state){
          element.textContent = state[key];
        }
      });

      updateLogo("home",state.homeLogo);
      updateLogo("away",state.awayLogo);

      const currentGameClockSeconds = mmssToSeconds(state.gameClock);

      if(
        previousGameClockSeconds !== null &&
        previousGameClockSeconds > 0 &&
        currentGameClockSeconds === 0
      ){
        playPeriodHorn();
      }

      previousGameClockSeconds = currentGameClockSeconds;
    }

    document.addEventListener("DOMContentLoaded",()=>{
      const audioButton = document.getElementById("enableAudioButton");

      if(audioButton){
        audioButton.addEventListener("click",unlockArenaAudio);
      }

      try{
        window.eastAveGameRef = initFirebaseScoreboard(renderDisplay);
        renderDisplay(getScoreboardState());
      }catch(error){
        console.error(error);

        document
          .querySelectorAll("[data-field='connection']")
          .forEach((element)=>{
            element.textContent = "CONFIG ERROR";
          });

        alert(error.message);
      }
    });
  </script>
</body>
</html>
